name: B - Verify and Test ISO

on:
  workflow_run:
    workflows: ["A - Build Kubuntu 26.04 ISO"]
    types:
      - completed

permissions:
  contents: write

jobs:
  verify-job:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Install Virtualization and Testing Utilities
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-system-x86 vncsnapshot jq curl

    - name: Verify and Prepare Cloud KVM Availability
      run: |
        echo "=== Checking Cloud Runner Hardware Acceleration Support ==="
        if [ -e /dev/kvm ]; then
            echo "✅ Success: KVM hardware nested acceleration is active on this cloud host!"
            sudo chmod 666 /dev/kvm
        else
            echo "⚠️ Warning: KVM module not detected, falling back to software emulation threads."
        fi

    - name: Fetch Latest ISO Asset via Direct Download Link
      id: fetch_iso
      run: |
        echo "=== Downloading compiled asset via native GitHub release paths ==="
        # FIXED: Bypasses API JSON lookups to download directly from the latest tag shortcut
        curl -L -o minimal.iso "https://github.com/${{ github.repository }}/releases/latest/download/kubuntu-26.04-minimal-hardened.iso"
        
        # Dynamically capture tag name for fallback artifact updating
        TAG_NAME=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
        echo "target_tag=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Accelerated Cloud-KVM Boot Execution Test Loop
      run: |
        echo "=== Launching Hardware Accelerated Cloud KVM Sandbox ==="
        sudo qemu-system-x86_64 \
          -enable-kvm \
          -cpu host \
          -m 2048 \
          -vga std \
          -cdrom minimal.iso \
          -display vnc=:1 \
          -daemonize
        
        echo "=== System is accelerating via KVM; waiting 25 seconds for full boot flow ==="
        sleep 25
        
        echo "=== Capturing frame buffer snapshots: immediate t=0 and every 5s for 60s ==="
        SNAP_DIR="${GITHUB_WORKSPACE:-.}/snapshots"
        mkdir -p "$SNAP_DIR"
        DURATION=120
        INTERVAL=5
        END_TIME=$(( $(date +%s) + DURATION ))
        COUNTER=0
        while [ "$(date +%s)" -le "$END_TIME" ]; do
          TS=$(date +%Y%m%d-%H%M%S)
          FNAME="test-proof-${COUNTER}-${TS}.jpg"
          echo "Taking snapshot: $FNAME"
          vncsnapshot -allowblank localhost:1 "$SNAP_DIR/$FNAME" || true
          COUNTER=$((COUNTER+1))
          sleep $INTERVAL
        done

        echo "Snapshots saved to $SNAP_DIR (total: $COUNTER)"

    - name: Attach Proof Screenshot(s) back to the Active Release Entry
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.fetch_iso.outputs.target_tag }}
        files: snapshots/*.jpg
